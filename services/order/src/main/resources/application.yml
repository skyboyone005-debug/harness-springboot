spring:
  application:
    name: order-service
  # 默认：内存 H2（MySQL 兼容模式），clone 下来零依赖即可 make dev / 跑测试
  datasource:
    url: jdbc:h2:mem:order;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration
server:
  port: ${PORT:8081}
user-svc:
  url: ${USER_SVC_URL:http://localhost:8082}
---
# 真实 MySQL：SPRING_PROFILES_ACTIVE=mysql（docker-compose 默认使用）
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
