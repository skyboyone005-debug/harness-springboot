services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      retries: 20
  user:
    build: { context: ., args: { SVC: user } }
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    depends_on: { mysql: { condition: service_healthy } }
  order:
    build: { context: ., args: { SVC: order } }
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://mysql:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      USER_SVC_URL: http://user:8080
    depends_on: { mysql: { condition: service_healthy } }
  gateway:
    build: { context: ., args: { SVC: gateway } }
    environment:
      PORT: "8080"
      GATEWAY_UPSTREAMS_USER: "http://user:8080"
      GATEWAY_UPSTREAMS_ORDER: "http://order:8080"
    ports: ["8080:8080"]
